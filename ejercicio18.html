<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - DOM y Bootstrap</title>
    <!-- Se incluye Bootstrap mediante CDN según requiere la consigna -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container" style="max-width: 500px;">
        <h2 class="mb-3">Lista Dinámica</h2>
        <div class="input-group mb-3">
            <input type="text" id="itemInput" class="form-control" placeholder="Agregar elemento...">
            <button class="btn btn-success" id="btnAdd">Agregar</button>
        </div>
        <ul id="itemList" class="list-group"></ul>
    </div>

    <script>
        document.getElementById('btnAdd').addEventListener('click', () => {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();

            if (text !== '') {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';
                li.innerHTML = `
                    <span>${text}</span>
                    <button class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Eliminar</button>
                `;
                document.getElementById('itemList').appendChild(li);
                input.value = '';
            }
        });
    </script>
</body>
</html>
