<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación del DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="card-title h4 text-center mb-4">Agregar y Eliminar Elementos</h1>

                        <div class="input-group mb-3">
                            <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe algo">
                            <button id="agregarBtn" class="btn btn-primary" type="button">Agregar</button>
                        </div>

                        <ul id="lista" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ejercicio18.js"></script>
</body>
</html>
