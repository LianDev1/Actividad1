<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - Km a Millas</title>
</head>
<body>
    <h1>Conversor de Kilómetros a Millas</h1>
    <label for="km">Distancia en Km:</label>
    <input type="number" id="km" placeholder="Ej. 10">
    <button onclick="convertir()">Convertir</button>
    <br><br>
    <label for="resultado">Resultado:</label>
    <input type="text" id="resultado" readonly>

    <script>
        function convertir() {
            const val = document.getElementById('km').value;
            if (val === "" || isNaN(val)) {
                alert("Por favor, ingresa un valor numérico.");
                return;
            }
            const km = parseFloat(val);
            const millas = km * 0.621371;
            document.getElementById('resultado').value = millas.toFixed(5) + " Millas";
        }
    </script>
</body>
</html>
