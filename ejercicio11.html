<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11 - Kilómetros a Millas</title>
</head>
<body>
    <h2>Conversor de Kilómetros a Millas</h2>
    <input type="number" id="km" placeholder="Ingrese kilómetros">
    <button id="btnConvertir">Convertir</button>
    <p id="resultado"></p>

    <script>
        document.getElementById('btnConvertir').addEventListener('click', () => {
            const km = parseFloat(document.getElementById('km').value);
            const res = document.getElementById('resultado');
            
            if (isNaN(km) || km < 0) {
                res.textContent = 'Ingrese un número válido mayor o igual a cero.';
                return;
            }
            
            const millas = km * 0.621371;
            res.textContent = `${km} km equivalen a ${millas.toFixed(2)} millas.`;
        });
    </script>
</body>
</html>
