<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 - Objetos</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .contenedor {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[readonly] {
            background-color: #eee;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Calificaciones de Estudiantes</h1>

        <label for="nombre">Nombre del estudiante</label>
        <input type="text" id="nombre" placeholder="Ej: Juan">

        <label for="calificacion">Calificación</label>
        <input type="text" id="calificacion" placeholder="Ej: 85">

        <button type="button" id="btnAgregar">Agregar estudiante</button>
        <button type="button" id="btnCalcular">Calcular</button>

        <label for="promedio">Calificación promedio</label>
        <input type="text" id="promedio" readonly>

        <label for="mejor">Estudiante con la calificación más alta</label>
        <input type="text" id="mejor" readonly>

        <label for="peor">Estudiante con la calificación más baja</label>
        <input type="text" id="peor" readonly>
    </div>

    <script src="js/ejercicio15.js"></script>
</body>
</html>
