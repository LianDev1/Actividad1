<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 17 - Gestor de Tareas</title>
</head>
<body>
    <h2>Gestor de Tareas</h2>
    <input type="text" id="nuevaTarea" placeholder="Nueva tarea">
    <button id="btnAgregar">Agregar</button>
    
    <ul id="listaTareas"></ul>

    <script>
        // Closure para encapsular el estado de las tareas y el LocalStorage
        const crearGestorTareas = () => {
            let tareas = JSON.parse(localStorage.getItem('tareas')) || [];

            const guardar = () => localStorage.setItem('tareas', JSON.stringify(tareas));

            return {
                agregar: (texto) => {
                    tareas.push(texto);
                    guardar();
                },
                eliminar: (index) => {
                    tareas.splice(index, 1);
                    guardar();
                },
                obtener: () => [...tareas]
            };
        };

        const gestor = crearGestorTareas();

        const renderizar = () => {
            const lista = document.getElementById('listaTareas');
            lista.innerHTML = '';
            
            gestor.obtener().forEach((tarea, index) => {
                const li = document.createElement('li');
                li.innerText = tarea + ' ';
                
                const btnBorrar = document.createElement('button');
                btnBorrar.innerText = 'Eliminar';
                btnBorrar.onclick = () => {
                    gestor.eliminar(index);
                    renderizar();
                };

                li.appendChild(btnBorrar);
                lista.appendChild(li);
            });
        };

        document.getElementById('btnAgregar').addEventListener('click', () => {
            const input = document.getElementById('nuevaTarea');
            if (input.value.trim() !== '') {
                gestor.agregar(input.value.trim());
                input.value = '';
                renderizar();
            }
        });

        renderizar();
    </script>
</body>
</html>
