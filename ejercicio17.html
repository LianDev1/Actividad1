<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17 - Gestión de Tareas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #agregarBtn {
            width: 100%;
            margin-bottom: 20px;
        }

        #listaTareas {
            list-style-type: none;
            padding: 0;
        }

        .tarea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: #f0f0f0;
            margin-bottom: 5px;
            border-radius: 4px;
        }

        .tarea button {
            background-color: #e74c3c;
        }

        .tarea button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Gestión de Tareas Pendientes</h1>

        <input type="text" id="nuevaTarea" placeholder="Escribe una tarea">
        <button type="button" id="agregarBtn">Agregar Tarea</button>

        <ul id="listaTareas"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/ejercicio17.js"></script>
</body>
</html>
