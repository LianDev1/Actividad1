<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Tablas Estructuradas</title>
    <link rel="stylesheet" href="css/ejercicio7.css">
</head>
<body>
    <div class="contenedor">
        <h2>Resumen de Compras</h2>
        <table class="tabla-datos">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Laptop Pro 15"</td>
                    <td>1</td>
                    <td>$15,000.00</td>
                </tr>
                <tr>
                    <td>Mouse Inalámbrico</td>
                    <td>2</td>
                    <td>$350.00</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2"><strong>Total</strong></td>
                    <td><strong>$15,700.00</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
