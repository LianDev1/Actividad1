<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Celsius a Fahrenheit</title>
</head>
<body>
    <h1>Conversor de Celsius a Fahrenheit</h1>
    <label for="celsius">Temperatura en °C:</label>
    <input type="number" id="celsius" placeholder="Ej. 25">
    <button onclick="convertir()">Convertir</button>
    <br><br>
    <label for="resultado">Resultado:</label>
    <input type="text" id="resultado" readonly>

    <script>
        function convertir() {
            const val = document.getElementById('celsius').value;
            if (val === "" || isNaN(val)) {
                alert("Por favor, ingresa un valor numérico válido.");
                return;
            }
            const c = parseFloat(val);
            const f = (c * 9 / 5) + 32;
            document.getElementById('resultado').value = f.toFixed(2) + " °F";
        }
    </script>
</body>
</html>
