<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10 - Conversor Celsius a Fahrenheit</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>
    <div class="conversor-card">
        <h2>Conversor de Temperatura</h2>
        
        <div class="campo">
            <label for="celsius">Grados Celsius (°C):</label>
            <input type="number" id="celsius" placeholder="Ej. 25">
        </div>

        <button id="btn-convertir">Convertir</button>

        <div class="campo">
            <label for="fahrenheit">Grados Fahrenheit (°F):</label>
            <input type="text" id="fahrenheit" readonly placeholder="Resultado...">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
