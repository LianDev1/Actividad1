<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12 - MXN a USD</title>
</head>
<body>
    <h2>Conversor de Pesos Mexicanos a Dólares</h2>
    <input type="number" id="mxn" placeholder="Monto en MXN">
    <button id="btnCalcular">Convertir a USD</button>
    <p id="salida"></p>

    <script>
        const TASA_CAMBIO = 0.050; // Tasa fija de ejemplo

        document.getElementById('btnCalcular').addEventListener('click', () => {
            const mxn = parseFloat(document.getElementById('mxn').value);
            const salida = document.getElementById('salida');

            if (isNaN(mxn) || mxn < 0) {
                salida.textContent = 'Ingrese un monto válido.';
                return;
            }

            const usd = mxn * TASA_CAMBIO;
            salida.textContent = `$${mxn.toFixed(2)} MXN = $${usd.toFixed(2)} USD`;
        });
    </script>
</body>
</html>
