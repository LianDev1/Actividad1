<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 13 - Verificación para Votar</title>
</head>
<body>
    <h2>Verificación de Edad para Votar</h2>
    <input type="number" id="edad" placeholder="Ingrese su edad">
    <button id="btnVerificar">Verificar</button>
    <p id="mensaje"></p>

    <script>
        document.getElementById('btnVerificar').addEventListener('click', () => {
            const edad = parseInt(document.getElementById('edad').value);
            const mensaje = document.getElementById('mensaje');

            if (isNaN(edad) || edad < 0) {
                mensaje.textContent = 'Ingrese una edad válida.';
            } else if (edad >= 18) {
                mensaje.textContent = 'Eres elegible para votar.';
            } else {
                mensaje.textContent = 'No tienes la edad suficiente para votar.';
            }
        });
    </script>
</body>
</html>
