<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 - Validación de Formulario</title>
</head>
<body>
    <h1>Validación de Formulario</h1>
    <label for="edad">Ingresa tu edad:</label>
    <input type="number" id="edad" placeholder="Ej. 20">
    <button onclick="verificar()">Verificar</button>
    <br><br>
    <label for="resultado">Estatus:</label>
    <input type="text" id="resultado" readonly>

    <script>
        function verificar() {
            const val = document.getElementById('edad').value;
            if (val === "" || isNaN(val) || parseInt(val) < 0) {
                alert("Por favor, ingresa una edad válida.");
                return;
            }
            const edad = parseInt(val);
            document.getElementById('resultado').value = edad >= 18 ? "Puedes votar" : "No puedes votar";
        }
    </script>
</body>
</html>
