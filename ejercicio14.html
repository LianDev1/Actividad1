<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14 - Estadísticas con Arreglos</title>
</head>
<body>
    <h2>Estadísticas de Números</h2>
    <input type="text" id="numerosInput" placeholder="Ej: 10, 20, 5, 8, 30">
    <button id="btnCalcular">Calcular</button>
    <div id="resultado"></div>

    <script>
        document.getElementById('btnCalcular').addEventListener('click', () => {
            const input = document.getElementById('numerosInput').value;
            const numeros = input.split(',').map(n => parseFloat(n.trim())).filter(n => !isNaN(n));
            const res = document.getElementById('resultado');

            if (numeros.length === 0) {
                res.textContent = 'Ingrese números válidos separados por comas.';
                return;
            }

            const suma = numeros.reduce((acc, curr) => acc + curr, 0);
            const promedio = suma / numeros.length;
            const max = Math.max(...numeros);
            const min = Math.min(...numeros);

            res.innerHTML = `
                <p><strong>Suma:</strong> ${suma}</p>
                <p><strong>Promedio:</strong> ${promedio.toFixed(2)}</p>
                <p><strong>Máximo:</strong> ${max}</p>
                <p><strong>Mínimo:</strong> ${min}</p>
            `;
        });
    </script>
</body>
</html>
